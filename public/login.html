<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In - Marc Fisher Footwear AI Hub</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>
    .login-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      gap: 32px;
      padding: 24px;
    }
    .login-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 48px 40px;
      text-align: center;
      max-width: 420px;
      width: 100%;
      box-shadow: var(--shadow);
    }
    .login-card .header-logo {
      height: 40px;
      margin-bottom: 8px;
    }
    .login-card h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 8px;
    }
    .login-card p {
      color: var(--text-secondary);
      font-size: 0.9rem;
      margin-bottom: 28px;
      line-height: 1.5;
    }
    .ms-signin-btn {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      background: #ffffff;
      border: 1px solid #8c8c8c;
      border-radius: 4px;
      padding: 10px 20px;
      font-size: 0.95rem;
      font-weight: 600;
      color: #5e5e5e;
      cursor: pointer;
      text-decoration: none;
      transition: box-shadow 0.2s;
    }
    .ms-signin-btn:hover {
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
    }
    .ms-signin-btn svg {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <img src="/logo.svg" alt="Marc Fisher Footwear" class="header-logo" /><br />
      <h1>Marc Fisher Footwear AI</h1>
      <p>Sign in with your Microsoft account to access the AI Hub.</p>
      <a href="/auth/signin" class="ms-signin-btn">
        <svg viewBox="0 0 23 23"><path fill="#f35325" d="M1 1h10v10H1z"/><path fill="#81bc06" d="M12 1h10v10H12z"/><path fill="#05a6f0" d="M1 12h10v10H1z"/><path fill="#ffba08" d="M12 12h10v10H12z"/></svg>
        Sign in with Microsoft
      </a>
    </div>
  </div>
</body>
</html>
